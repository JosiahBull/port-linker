name: CI

on:
  # Reusable: release.yaml calls this workflow on a tag, so a release runs the
  # same gates a pull request does, from the same file. The edge points this way
  # deliberately — a shim ci.yaml calling a separate checks.yaml would report
  # every job as `checks / <name>`, renaming all of them at once. See CI.md.
  workflow_call:
  # Only main, so a branch with an open PR runs CI once rather than twice.
  # Two runs of the same job on the same commit race for the shared Rust
  # cache; the loser rebuilds from scratch, which on a Windows release build
  # is slow enough to hit the job timeout and cancel a required check.
  push:
    branches: [main]
    paths:
      - ".cargo/*.toml"
      - ".github/workflows/*.yaml"
      - ".github/workflows/*.yml"
      - ".githooks/**"
      - "Cargo.*"
      - "Cross.toml"
      - "rustfmt.toml"
      - "scripts/**"
      - "**/src/**"
      - "**/tests/**"
  # No paths filter, deliberately: Gate is the only required check, so it has to
  # report on every pull request or a docs-only change can never merge.
  pull_request:
    branches: [main]

# see https://matklad.github.io/2021/09/04/fast-rust-builds.html
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  CI: 1
  RUST_BACKTRACE: short
  RUSTUP_MAX_RETRIES: 10
  RUSTFLAGS: "-D warnings"
  RUSTDOCFLAGS: "-D warnings"

# Default-deny. No job here needs more; release.yaml escalates only in the job
# that publishes.
permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: ci-check-${{ github.repository }}-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2

      - name: Run cargo check
        run: cargo check --workspace --all-targets --all-features

  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: ci-fmt-${{ github.repository }}-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: rustfmt

      - name: Check formatting
        run: bash scripts/check-fmt.sh

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: ci-clippy-${{ github.repository }}-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Run clippy
        run: bash scripts/check-clippy.sh

  test:
    name: Tests
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    concurrency:
      group: ci-test-${{ github.repository }}-${{ github.event_name }}-${{ github.ref }}-${{ matrix.os }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2

      # `bash scripts/...`, not `./scripts/...`: this job runs on Windows too,
      # where a checkout need not preserve the executable bit.
      - name: Run tests
        shell: bash
        run: bash scripts/test.sh

  doc:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: ci-doc-${{ github.repository }}-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: rust-docs

      - uses: Swatinem/rust-cache@v2

      - name: Build documentation
        run: bash scripts/check-docs.sh

  test-docker:
    name: Docker Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [check, clippy]
    concurrency:
      group: ci-test-docker-${{ github.repository }}-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2

      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools socat

      - name: Build binaries for musl
        run: cargo build -p agent -p udp-relay -p cli --target x86_64-unknown-linux-musl

      - name: Build CLI (native)
        run: cargo build -p cli

      - name: Run Docker integration tests
        run: bash tests/docker/run-tests.sh ci

  # Agents and relays are built on a runner that can actually target them, then
  # handed to the CLI build as artifacts. No single runner can produce every
  # target: a Linux host cannot build the Apple or Windows agents (no SDK, and
  # `cross` publishes no Apple images) and a macOS runner cannot build the Linux
  # musl agents (cross needs Docker, which macOS runners do not have).
  build-agents:
    name: Build Agent (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    concurrency:
      group: ci-build-agents-${{ github.repository }}-${{ github.event_name }}-${{ github.ref }}-${{ matrix.target }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            command: cross
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            command: cross
          - target: aarch64-apple-darwin
            os: macos-latest
            command: cargo
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            command: cargo
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            command: cargo
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: agents-${{ matrix.target }}

      # Same tool per target as the release workflow: cross (Docker) for the
      # Linux musl targets, native cargo for Apple silicon.
      - name: Install cross
        if: matrix.command == 'cross'
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      # The agent-release profile already applies opt-level=z, fat LTO,
      # panic=abort and strip. build-std would shrink it further but needs a
      # nightly toolchain inside the cross image, which is not worth the
      # fragility for a CI artifact — the release pipeline can still do it.
      # Explicit shell: windows-latest defaults to PowerShell, which cannot
      # parse the backslash line continuations below.
      - name: Build agent and relay
        shell: bash
        run: |
          ${{ matrix.command }} build \
            -p agent -p udp-relay \
            --profile agent-release \
            --target ${{ matrix.target }}

      # Named as `agent-build::output_filename` expects, so the CLI build can
      # pick them straight out of PLK_PREBUILT_DIR. The staged names carry no
      # extension even for Windows — `find_binary` handles `.exe` on the source
      # side only.
      - name: Stage binaries for the CLI build
        shell: bash
        run: |
          ext=""
          case "${{ matrix.target }}" in *windows*) ext=".exe" ;; esac
          src="target/${{ matrix.target }}/agent-release"
          mkdir -p prebuilt
          cp "$src/port-linker-agent$ext" "prebuilt/agent-${{ matrix.target }}"
          cp "$src/port-linker-relay$ext" "prebuilt/udp-relay-${{ matrix.target }}"
          ls -l prebuilt

      - uses: actions/upload-artifact@v4
        with:
          name: prebuilt-${{ matrix.target }}
          path: prebuilt/
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build
    runs-on: ${{ matrix.os }}
    # A warm build is 3-4 minutes; a cold one on Windows ran past 45 and was
    # cancelled (PR #9, which changed every workspace version and so missed the
    # cache). Any Cargo.lock change builds cold, so leave real headroom.
    timeout-minutes: 60
    needs: [build-agents]
    concurrency:
      group: ci-build-${{ github.repository }}-${{ github.event_name }}-${{ github.ref }}-${{ matrix.os }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2

      - name: Install UPX (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y upx

      - name: Install UPX (Windows)
        if: matrix.os == 'windows-latest'
        run: choco install upx -y

      # Every target's agent and relay, merged into one directory.
      - uses: actions/download-artifact@v4
        with:
          pattern: prebuilt-*
          merge-multiple: true
          path: prebuilt

      # The embed crates include_bytes! every target, so a missing one is a
      # build failure later — catch it here with a clearer message.
      - name: Verify all agents are present
        shell: bash
        run: |
          ls -l prebuilt
          for t in x86_64-unknown-linux-musl aarch64-unknown-linux-musl \
                   aarch64-apple-darwin x86_64-pc-windows-msvc aarch64-pc-windows-msvc; do
            for p in agent udp-relay; do
              test -s "prebuilt/$p-$t" || { echo "missing prebuilt/$p-$t"; exit 1; }
            done
          done

      - name: Build release
        env:
          # Workspace-relative so it resolves identically inside cross containers.
          PLK_PREBUILT_DIR: prebuilt
        # `-p cli`, not `--workspace`: this job exists to prove the shipped binary
        # links, and the steps below only ever touch target/release/port-linker.
        # `--workspace` additionally fat-LTO-links the agent, relay and perf
        # binaries, none of which ship from here — four full LTO links instead of
        # one, which is most of why a cold Windows run blew the timeout.
        run: cargo build -p cli --release --locked

      - name: Compress binary with UPX (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          upx --best --lzma target/release/port-linker
          ls -lh target/release/port-linker

      - name: Compress binary with UPX (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          upx --best --lzma target/release/port-linker.exe
          ls -lh target/release/port-linker.exe

      - name: Upload binary artifact (Unix)
        if: matrix.os != 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: port-linker-${{ matrix.os }}
          path: target/release/port-linker
          if-no-files-found: error

      - name: Upload binary artifact (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: port-linker-${{ matrix.os }}
          path: target/release/port-linker.exe
          if-no-files-found: error

  versions:
    name: Versions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: ci-versions-${{ github.repository }}-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      # Pure text parsing, so no toolchain and no cache. On a tag — release.yaml
      # calls this workflow, so GITHUB_REF_TYPE is `tag` here — it additionally
      # asserts the tag matches [workspace.package] version, which is what makes
      # it impossible to publish a signed vX from a tree that says vY.
      - name: Check versions
        run: bash scripts/check-versions.sh

  deps:
    name: Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: ci-deps-${{ github.repository }}-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly

      - uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: true
          cache-bin: true

      # A published binary, rather than `cargo +nightly install --locked
      # cargo-udeps`, which rebuilt it from source on every run.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-udeps

      - name: Check for openssl in the runtime graph
        run: bash scripts/check-deps.sh

      - name: Check for unused dependencies
        run: bash scripts/check-unused-deps.sh

  workflows:
    name: Workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: ci-workflows-${{ github.repository }}-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      # Replaces `bash <(curl .../actionlint/main/scripts/download-actionlint.bash)`,
      # which piped an unpinned script from a moving branch into bash, with curl
      # having no -f so an error page would have been executed too.
      - uses: taiki-e/install-action@v2
        with:
          tool: actionlint

      - name: Lint workflows and scripts
        run: bash scripts/check-workflows.sh

  # The single required status check on main.
  #
  # Branch protection matches required checks by exact job display name, so with
  # one context per job the list drifts silently: add a job, or a leg to a
  # matrix, and it is not required until someone remembers to add it by hand — a
  # new gate that cannot fail a PR looks identical to one that can. Every job
  # above is a `needs:` here instead, so the gate set is whatever this workflow
  # runs, and restructuring below never touches branch protection again.
  gate:
    name: Gate
    needs:
      - check
      - fmt
      - clippy
      - test
      - doc
      - test-docker
      - build-agents
      - build
      - versions
      - deps
      - workflows
    # `always()`, so a job that fails still produces a Gate result rather than
    # leaving the one required check permanently pending.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: ci-gate-${{ github.repository }}-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Require every job to have succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          # `skipped` has to fail too. A job dropped by a stray `if:` or an
          # unmet `needs:` would otherwise satisfy the only required check.
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::a required job reported '$result'"
              exit 1
            fi
          done
          echo "✓ every required job succeeded"

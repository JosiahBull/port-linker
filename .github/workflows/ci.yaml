name: CI

on:
  push:
    paths:
      - ".cargo/*.toml"
      - ".github/workflows/*.yaml"
      - ".github/workflows/*.yml"
      - "Cargo.*"
      - "**/src/**"
      - "**/tests/**"
  pull_request:
    branches: [main]

# see https://matklad.github.io/2021/09/04/fast-rust-builds.html
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  CI: 1
  RUST_BACKTRACE: short
  RUSTUP_MAX_RETRIES: 10
  RUSTFLAGS: "-D warnings"
  RUSTDOCFLAGS: "-D warnings"

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: ci-check-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2

      - name: Run cargo check
        run: cargo check --workspace --all-targets --all-features

  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: ci-fmt-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: ci-clippy-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: Tests
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    concurrency:
      group: ci-test-${{ github.repository }}-${{ github.ref }}-${{ matrix.os }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2

      # tests/integration_test.rs spawns the agent binary. `cargo test` does not
      # build another package's binary just because a test wants it, so build it
      # explicitly rather than let the test suite shell out to cargo mid-run.
      - name: Build agent binary
        run: cargo build -p agent

      # Not `--bins`: that only runs binary targets, which silently skipped every
      # lib unit test and the whole of tests/integration_test.rs.
      - name: Run tests
        run: cargo test --workspace --all-features

  test-data-plane:
    name: Data Plane & Performance Tests
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    concurrency:
      group: ci-test-data-plane-${{ github.repository }}-${{ github.ref }}-${{ matrix.os }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        # Not Windows: the perf fixture spawns the Linux/macOS agent binary.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2

      # The latency benchmark drives the real agent as a subprocess.
      - name: Build agent
        run: cargo build -p agent

      # Forwarding protocol edge cases: ordering, half-close, failure paths.
      - name: Run data plane tests
        run: cargo test -p tunnel

      # Asserts connection setup costs no round trip, and that the benchmark can
      # still see one when it is there. Thresholds are RTT-relative, so a loaded
      # runner does not make this flaky.
      - name: Run performance regression tests
        run: cargo test -p perf

  doc:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: ci-doc-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: rust-docs

      - uses: Swatinem/rust-cache@v2

      - name: Build documentation
        run: cargo doc --workspace --all-features --no-deps

  test-docker:
    name: Docker Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [check, clippy]
    concurrency:
      group: ci-test-docker-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2

      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools socat

      - name: Build binaries for musl
        run: cargo build -p agent -p udp-relay -p cli --target x86_64-unknown-linux-musl

      - name: Build CLI (native)
        run: cargo build -p cli

      - name: Run Docker integration tests
        run: bash tests/docker/run-tests.sh ci

  # Agents and relays are built on a runner that can actually target them, then
  # handed to the CLI build as artifacts. No single runner can produce every
  # target: a Linux host cannot build the Apple or Windows agents (no SDK, and
  # `cross` publishes no Apple images) and a macOS runner cannot build the Linux
  # musl agents (cross needs Docker, which macOS runners do not have).
  build-agents:
    name: Build Agent (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    concurrency:
      group: ci-build-agents-${{ github.repository }}-${{ github.ref }}-${{ matrix.target }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            command: cross
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            command: cross
          - target: aarch64-apple-darwin
            os: macos-latest
            command: cargo
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            command: cargo
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            command: cargo
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: agents-${{ matrix.target }}

      # Same tool per target as the release workflow: cross (Docker) for the
      # Linux musl targets, native cargo for Apple silicon.
      - name: Install cross
        if: matrix.command == 'cross'
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      # The agent-release profile already applies opt-level=z, fat LTO,
      # panic=abort and strip. build-std would shrink it further but needs a
      # nightly toolchain inside the cross image, which is not worth the
      # fragility for a CI artifact — the release pipeline can still do it.
      # Explicit shell: windows-latest defaults to PowerShell, which cannot
      # parse the backslash line continuations below.
      - name: Build agent and relay
        shell: bash
        run: |
          ${{ matrix.command }} build \
            -p agent -p udp-relay \
            --profile agent-release \
            --target ${{ matrix.target }}

      # Named as `agent-build::output_filename` expects, so the CLI build can
      # pick them straight out of PLK_PREBUILT_DIR. The staged names carry no
      # extension even for Windows — `find_binary` handles `.exe` on the source
      # side only.
      - name: Stage binaries for the CLI build
        shell: bash
        run: |
          ext=""
          case "${{ matrix.target }}" in *windows*) ext=".exe" ;; esac
          src="target/${{ matrix.target }}/agent-release"
          mkdir -p prebuilt
          cp "$src/port-linker-agent$ext" "prebuilt/agent-${{ matrix.target }}"
          cp "$src/port-linker-relay$ext" "prebuilt/udp-relay-${{ matrix.target }}"
          ls -l prebuilt

      - uses: actions/upload-artifact@v4
        with:
          name: prebuilt-${{ matrix.target }}
          path: prebuilt/
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    needs: [build-agents]
    concurrency:
      group: ci-build-${{ github.repository }}-${{ github.ref }}-${{ matrix.os }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2

      - name: Install UPX (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y upx

      - name: Install UPX (Windows)
        if: matrix.os == 'windows-latest'
        run: choco install upx -y

      # Every target's agent and relay, merged into one directory.
      - uses: actions/download-artifact@v4
        with:
          pattern: prebuilt-*
          merge-multiple: true
          path: prebuilt

      # The embed crates include_bytes! every target, so a missing one is a
      # build failure later — catch it here with a clearer message.
      - name: Verify all agents are present
        shell: bash
        run: |
          ls -l prebuilt
          for t in x86_64-unknown-linux-musl aarch64-unknown-linux-musl \
                   aarch64-apple-darwin x86_64-pc-windows-msvc aarch64-pc-windows-msvc; do
            for p in agent udp-relay; do
              test -s "prebuilt/$p-$t" || { echo "missing prebuilt/$p-$t"; exit 1; }
            done
          done

      - name: Build release
        env:
          # Workspace-relative so it resolves identically inside cross containers.
          PLK_PREBUILT_DIR: prebuilt
        run: cargo build --workspace --release

      - name: Compress binary with UPX (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          upx --best --lzma target/release/port-linker
          ls -lh target/release/port-linker

      - name: Compress binary with UPX (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          upx --best --lzma target/release/port-linker.exe
          ls -lh target/release/port-linker.exe

      - name: Upload binary artifact (Unix)
        if: matrix.os != 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: port-linker-${{ matrix.os }}
          path: target/release/port-linker
          if-no-files-found: error

      - name: Upload binary artifact (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: port-linker-${{ matrix.os }}
          path: target/release/port-linker.exe
          if-no-files-found: error

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_type:
        description: "Release type"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - release

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUST_BACKTRACE: short
  RUSTUP_MAX_RETRIES: 10

# Default-deny; the publishing job escalates to what it actually needs.
permissions:
  contents: read

# Never cancel in progress: a superseded run may already have signed and published
# some assets, and killing it midway leaves a half-published release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The full pull-request gate suite, run against the tag. Same file CI runs, so
  # there is no release-only copy of any check and nothing can be published that
  # a pull request would have rejected. On a tag the Versions gate additionally
  # asserts the tag matches the declared version.
  #
  # This also replaces the agent builds that used to be duplicated here verbatim:
  # a called workflow's jobs run inside this run, so the `prebuilt-*` artifacts
  # its Build Agent jobs upload are downloadable by the build job below.
  gates:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yaml

  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    # A cold Windows release build runs past 45 minutes (fat LTO, codegen-units=1),
    # and a release tag always builds cold.
    timeout-minutes: 60
    needs: [gates]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: port-linker
            asset_name: port-linker-linux-x86_64
            command: cargo
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            artifact_name: port-linker
            asset_name: port-linker-linux-x86_64-musl
            command: cross
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: port-linker
            asset_name: port-linker-linux-aarch64
            command: cross
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            artifact_name: port-linker
            asset_name: port-linker-linux-aarch64-musl
            command: cross
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact_name: port-linker
            asset_name: port-linker-macos-x86_64
            command: cargo
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact_name: port-linker
            asset_name: port-linker-macos-aarch64
            command: cargo
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact_name: port-linker.exe
            asset_name: port-linker-windows-x86_64
            command: cargo
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            artifact_name: port-linker.exe
            asset_name: port-linker-windows-aarch64
            command: cargo

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross
        if: matrix.command == 'cross'
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Install UPX (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y upx

      # Every target's agent and relay, merged into one directory.
      - uses: actions/download-artifact@v4
        with:
          pattern: prebuilt-*
          merge-multiple: true
          path: prebuilt

      # The embed crates include_bytes! every target, so a missing one is a
      # build failure later — catch it here with a clearer message.
      - name: Verify all agents are present
        shell: bash
        run: |
          ls -l prebuilt
          for t in x86_64-unknown-linux-musl aarch64-unknown-linux-musl \
                   aarch64-apple-darwin x86_64-pc-windows-msvc aarch64-pc-windows-msvc; do
            for p in agent udp-relay; do
              test -s "prebuilt/$p-$t" || { echo "missing prebuilt/$p-$t"; exit 1; }
            done
          done

      - name: Build release binary
        env:
          # Workspace-relative so it resolves identically inside cross containers.
          PLK_PREBUILT_DIR: prebuilt
        run: ${{ matrix.command }} build --release --target ${{ matrix.target }}

      - name: Compress binary with UPX (Linux x86_64)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          upx --best --lzma target/${{ matrix.target }}/release/${{ matrix.artifact_name }}

      - name: Create release archive
        run: |
          cd target/${{ matrix.target }}/release
          tar -czvf ../../../${{ matrix.asset_name }}.tar.gz ${{ matrix.artifact_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}.tar.gz
          if-no-files-found: error

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write # Required for cosign keyless signing
    steps:
      - uses: actions/checkout@v4

      # Only the release tarballs. Without the pattern this also pulls down the five
      # `prebuilt-*` agent artifacts, whose directories contain no tarball — and the
      # asset step below then fails on them.
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: port-linker-*
          path: artifacts

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            # Tag push - use the tag name
            VERSION="${{ github.ref_name }}"
            PRERELEASE=false
          else
            # Manual dispatch
            if [[ "${{ github.event.inputs.release_type }}" == "dev" ]]; then
              VERSION="dev-$(date +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}"
              PRERELEASE=true
            else
              # Get version from Cargo.toml for manual release
              VERSION="v$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')"
              PRERELEASE=false
            fi
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: Prepare release assets
        run: |
          mkdir -p release
          # `find` rather than a glob loop: an unmatched glob stays literal under
          # `bash -e`, so a directory holding no tarball killed the whole step.
          find artifacts -type f -name '*.tar.gz' -exec cp {} release/ \;
          ls -la release/
          # Every target must have produced a tarball. Publishing a partial set is
          # worse than failing: the release looks complete and silently is not.
          count=$(find release -type f -name '*.tar.gz' | wc -l | tr -d ' ')
          if [ "$count" -ne 8 ]; then
            echo "::error::expected 8 release tarballs, found $count"
            exit 1
          fi

      - name: Generate checksums
        run: |
          cd release
          sha256sum ./*.tar.gz > checksums-sha256.txt
          md5sum ./*.tar.gz > checksums-md5.txt
          echo "SHA256:"
          cat checksums-sha256.txt
          echo ""
          echo "MD5:"
          cat checksums-md5.txt

      - name: Sign artifacts with cosign
        run: |
          cd release
          # Sign each tar.gz file
          for file in *.tar.gz; do
            cosign sign-blob --yes --output-signature "${file}.sig" --output-certificate "${file}.pem" "$file"
          done
          # Also sign the checksums files
          cosign sign-blob --yes --output-signature "checksums-sha256.txt.sig" --output-certificate "checksums-sha256.txt.pem" "checksums-sha256.txt"
          cosign sign-blob --yes --output-signature "checksums-md5.txt.sig" --output-certificate "checksums-md5.txt.pem" "checksums-md5.txt"
          ls -la

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          prerelease: ${{ steps.version.outputs.prerelease }}
          generate_release_notes: true
          files: |
            release/*.tar.gz
            release/*.sig
            release/*.pem
            release/checksums-sha256.txt
            release/checksums-md5.txt
          body: |
            ## Installation

            ### Using cargo-binstall (Recommended)

            ```bash
            cargo binstall port-linker
            ```

            ### Manual download

            Download the appropriate binary for your platform:

            | Platform | Architecture | File |
            |----------|--------------|------|
            | Linux | x86_64 | `port-linker-linux-x86_64.tar.gz` |
            | Linux | x86_64 (musl) | `port-linker-linux-x86_64-musl.tar.gz` |
            | Linux | aarch64 | `port-linker-linux-aarch64.tar.gz` |
            | Linux | aarch64 (musl) | `port-linker-linux-aarch64-musl.tar.gz` |
            | macOS | x86_64 (Intel) | `port-linker-macos-x86_64.tar.gz` |
            | macOS | aarch64 (Apple Silicon) | `port-linker-macos-aarch64.tar.gz` |
            | Windows | x86_64 | `port-linker-windows-x86_64.tar.gz` |
            | Windows | aarch64 | `port-linker-windows-aarch64.tar.gz` |

            ### Quick install

            ```bash
            # Linux x86_64
            curl -LO https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.version }}/port-linker-linux-x86_64.tar.gz
            tar -xzf port-linker-linux-x86_64.tar.gz
            chmod +x port-linker
            sudo mv port-linker /usr/local/bin/

            # macOS (Apple Silicon)
            curl -LO https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.version }}/port-linker-macos-aarch64.tar.gz
            tar -xzf port-linker-macos-aarch64.tar.gz
            chmod +x port-linker
            sudo mv port-linker /usr/local/bin/
            ```

            ### Verify checksums

            ```bash
            # SHA256 (recommended)
            sha256sum -c checksums-sha256.txt

            # MD5
            md5sum -c checksums-md5.txt
            ```

            ### Verify signatures

            All release artifacts are signed using [cosign](https://github.com/sigstore/cosign) with keyless signing.

            ```bash
            # Install cosign: https://docs.sigstore.dev/cosign/system_config/installation/

            # Verify a specific artifact
            cosign verify-blob \
              --signature port-linker-linux-x86_64.tar.gz.sig \
              --certificate port-linker-linux-x86_64.tar.gz.pem \
              --certificate-identity-regexp "https://github.com/${{ github.repository }}/" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              port-linker-linux-x86_64.tar.gz

            # Verify checksums files
            cosign verify-blob \
              --signature checksums-sha256.txt.sig \
              --certificate checksums-sha256.txt.pem \
              --certificate-identity-regexp "https://github.com/${{ github.repository }}/" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              checksums-sha256.txt

            cosign verify-blob \
              --signature checksums-md5.txt.sig \
              --certificate checksums-md5.txt.pem \
              --certificate-identity-regexp "https://github.com/${{ github.repository }}/" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              checksums-md5.txt
            ```
